name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The game app lives in client/; every `run:` step works from there.
defaults:
  run:
    working-directory: client

permissions:
  contents: read

jobs:
  # Split in two on purpose: these run in parallel, and a lint failure and a broken
  # board are different pieces of news that should not queue behind each other.
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 208 of them, and three carry the weight: the replay property test, the
      # frozen-state test that catches a mutation in applyMove, and purity.test.ts
      # reading the source to prove src/game never reaches for the browser.
      - name: Unit and component tests
        run: pnpm test

  e2e:
    name: Build and regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            automation-testing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build the static export
        run: pnpm build

      # NFR-PERF-05, measured from the exported HTML rather than from the build
      # table, so it breaks on a regression and not on a Next.js release.
      - name: First-load JS budget
        run: pnpm check:bundle

      # The same app with the Ducker ID flag ON and a fake issuer, for the ducker-id
      # module only (ADR-0012). The ordinary out/ above stays flag-off.
      - name: Build the flag-on export for the sign-in module
        run: pnpm build:e2e-auth

      # The regression suite is its own package (automation-testing/). Both exports
      # are already built above, so CLIENT_PREBUILT=1 tells its webServer to only
      # serve client/out and client/out-auth (scripts/serve.mjs), not build again.
      - name: Install the regression suite
        working-directory: automation-testing
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: automation-testing
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck, unit, traceability
        working-directory: automation-testing
        run: pnpm typecheck && pnpm test:unit && pnpm coverage:check

      # Every module against the static export, the thing GitHub Pages serves. Three
      # cases replay a solved deal to the win screen and one plays it by keyboard;
      # each takes a minute or two.
      - name: Regression suite
        working-directory: automation-testing
        env:
          CLIENT_PREBUILT: "1"
        run: pnpm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          retention-days: 7

  # NFR-SEC-05 in CI. It is here rather than as a `check:audit` step because
  # GITHUB_TOKEN cannot read Dependabot alerts (403 "Resource not accessible by
  # integration"), so that script cannot run in a job without a personal access
  # token. See ADR-0008 - written when the alternative, yarn 1's audit endpoint, had
  # stopped answering entirely. `pnpm audit` does answer, which reopens that choice,
  # but reopening it is a decision of its own and not part of a toolchain swap.
  #
  # This reviews the dependency diff of the pull request, which is where a vulnerable
  # dependency actually enters the project. A vulnerability newly disclosed against a
  # dependency already here arrives instead as a Dependabot alert and its automated
  # fix PR - which then comes back through this same job.
  dependencies:
    name: New dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm, high) has no patched release at
          # all. It only reaches the tree through build tooling - tailwindcss
          # (chokidar, micromatch) and eslint-config-next (fast-glob) - so it never
          # ships in the static export. Remove this line once a fixed braces exists.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm
