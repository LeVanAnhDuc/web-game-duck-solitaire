name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # check:audit reads this repository's Dependabot alerts - see scripts/check-audit.mjs
  security-events: read

jobs:
  # Split in two on purpose: these run in parallel, and a lint failure and a broken
  # board are different pieces of news that should not queue behind each other.
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      # 208 of them, and three carry the weight: the replay property test, the
      # frozen-state test that catches a mutation in applyMove, and purity.test.ts
      # reading the source to prove src/game never reaches for the browser.
      - name: Unit and component tests
        run: yarn test

      # NFR-SEC-05, read from this repository's Dependabot alerts. `yarn audit` is
      # not used: yarn 1's audit endpoint times out on every call now, and the
      # ported script it came with reported a pass when that happened.
      - name: Dependency audit
        run: yarn check:audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Build the static export
        run: yarn build

      # NFR-PERF-05, measured from the exported HTML rather than from the build
      # table, so it breaks on a regression and not on a Next.js release.
      - name: First-load JS budget
        run: yarn check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs against out/ through scripts/serve.mjs - the thing GitHub Pages will
      # serve, at 320 / 375 / 768 / 1440. The 1440 project additionally replays a
      # solved deal all the way to the win screen, which takes about a minute.
      - name: End-to-end tests
        run: yarn test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Alerts only exist once GitHub has scanned a pushed lockfile, so they cannot catch
  # a vulnerable dependency being introduced by this very branch. This closes that
  # window - it reviews the dependency diff of the pull request itself, and it only
  # has a diff to review on a pull request.
  dependencies:
    name: New dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
